[package]
name = "lantern"
version = "0.1.0"
edition = "2021"
description = "Lantern host daemon"

[dependencies]
anyhow = "1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
libc = "0.2"
lantern-proto = { path = "../proto" }
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
